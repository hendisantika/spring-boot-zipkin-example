# This workflow builds and tests both Zipkin example services with Maven on JDK 25.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - spring-boot-zipkin-example-service-1
          - spring-boot-zipkin-example-service-2

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build & test with Maven
        run: mvn -B -ntp clean verify --file ${{ matrix.service }}/pom.xml

  dependency-graph:
    name: Update dependency graph
    # Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        service:
          - spring-boot-zipkin-example-service-1
          - spring-boot-zipkin-example-service-2

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Submit dependency graph
        uses: advanced-security/maven-dependency-submission-action@v6
        with:
          directory: ${{ matrix.service }}
          correlator: ${{ github.job }}-${{ matrix.service }}
          ignore-maven-wrapper: true
